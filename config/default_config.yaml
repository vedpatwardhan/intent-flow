# LatentFlow Global Configuration

stage: null
use_subset: false

model:
  latent_dim: 512
  num_heads: 8
  num_layers: 4
  mlp_ratio: 4.0
  dropout: 0.1

  # Joint limits and dimensions for Fourier GR-1 Hand 6DoF
  action_dim: 12  # Hand joints torque/velocity output dimensions
  state_dim: 24   # Proprioceptive state dimensions (joint angles, velocities)

  # Predictor configuration
  horizon: 8
  bottleneck_dim: 16
  vggt_dim: 768

stage1:
  lr: 0.0005
  batch_size: 128
  epochs: 100
  weight_decay: 0.0001
  loss_weight_dynamics: 1.0

stage2:
  lr: 0.0003
  batch_size: 64
  epochs: 50
  flow_steps: 100
  combostoc_noise_ratio: 0.2

stage3:
  lr: 0.0001
  batch_size: 32
  epochs: 100
  gamma: 0.99
  ram_weight: 1.0
  adv_weight: 0.1
  distill_weight: 0.5
  auto_npo_interval: 1000  # Checkpoint evaluation interval (steps)

wandb:
  project: "latentflow-stage1"
  entity: "vedpat3-none"
  log_model: "all"

num_workers: 4

paths:
  urdf_path: "repos/Wiki-GRx-Models/GRX/GR1/gr1t2/urdf/gr1t2_fourier_hand_6dof.urdf"
  dataset_dir: "latent-flow/data/processed"
  checkpoint_dir: "latent-flow/checkpoints"
  log_dir: "latent-flow/logs"
  subdir: ""
